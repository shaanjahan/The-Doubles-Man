# Netlify build config for the doubles-dash-trini frontend (Vite + React,
# BrowserRouter). The app is in a subdirectory of the repo, so `base` points
# Netlify there; `publish` is relative to base (=> doubles-dash-trini/dist).
[build]
  base = "doubles-dash-trini"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Env vars (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) are set in the Netlify UI,
# NOT here — they bake into the client bundle at build time. The anon key is a
# publishable key (RLS-protected), so shipping it to the browser is expected.

# /get is served from the STATIC file public/get/index.html (copied to
# dist/get/index.html at build). Netlify only applies a non-forced redirect when
# no real file exists at the path, so the SPA fallback below never shadows it —
# that is what keeps /get out of the JS-rendered app entirely.
#
# /app was previously an SPA page that auto-redirected via an itms-appss://
# scheme on load; in-app browsers (Instagram/Facebook) block custom schemes and
# were left on a blank page. Links to /app are already published, so it now
# lands on the same static page instead. 302 (not 301) so it stays re-pointable.
[[redirects]]
  from = "/app"
  to = "/get"
  status = 302

# Explicit rewrites for /get. Netlify's non-forced rules already yield to real
# files, but relying on that implicit precedence is exactly how /get would
# silently fall back into the SPA again (vite preview does precisely that
# locally). First matching rule wins, so these run before the /* fallback.
[[redirects]]
  from = "/get"
  to = "/get/index.html"
  status = 200

[[redirects]]
  from = "/get/"
  to = "/get/index.html"
  status = 200

# SPA fallback: BrowserRouter routes (e.g. /login, deep links, refreshes) must
# resolve to index.html rather than 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
